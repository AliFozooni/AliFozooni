name: Refresh contribution graph

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-contribution-graph.mjs"
      - "scripts/generate-contribution-graph.test.mjs"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: refresh-contribution-graph
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test fixed color scale
        run: npm test

      - name: Generate light and dark graphs
        run: npm run generate

      - name: Commit refreshed graph
        run: |
          git add assets/contribution-graph.svg assets/contribution-graph-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh contribution graph"
          git push
